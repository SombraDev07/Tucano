[workspace]
name = "tucano"
version = "0.22.0"
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["linux-64"]

[tasks]
test = "mojo -I . tests/test_tucano.mojo"
bench = "mojo -I . bench/bench_m0.mojo"
bench-m3 = "mojo -I . bench/bench_m3.mojo"
bench-m4 = "mojo -I . bench/bench_m4.mojo"
bench-m5 = "mojo -I . bench/bench_m5.mojo"
bench-m6 = "mojo -I . bench/bench_m6.mojo"
bench-m8 = "mojo -I . bench/bench_m8.mojo"
bench-m9 = "mojo -I . bench/bench_m9.mojo"
bench-comparativo = "mojo -I . bench/bench_comparativo.mojo"
bench-leitura = "mojo -I . bench/bench_leitura.mojo"
bench-parquet = "mojo -I . bench/bench_parquet.mojo"
parquet-roundtrip = "mojo -I . tools/roundtrip_parquet.mojo"
arrow-roundtrip = "mojo -I . tools/roundtrip_arrow.mojo"
exemplo = "mojo -I . exemplo_tucano.mojo"
painel = "mojo -I . exemplo_painel.mojo"
build = "mojo precompile tucano -o tucano.mojoc"
play = "mojo jogo.mojo"

[dependencies]
mojo = ">=1.0.0,<2"

# Ambiente separado, so para GERAR fixtures binarias de teste (Parquet).
# Nao entra no runtime da biblioteca: o principio de Zero Python e sobre o que
# o Tucano carrega em producao, nao sobre a bancada de teste. Nenhum modulo em
# `tucano/` importa nada daqui.
[feature.fixtures.dependencies]
python = ">=3.11"
pyarrow = "*"

[feature.fixtures.tasks]
fixtures = "python tools/gerar_fixtures_parquet.py"
interop = "python tools/verificar_interop_parquet.py"
interop-arrow = "python tools/verificar_interop_arrow.py"

# Ambiente separado, so para MEDIR contra engines de referencia. Como o de
# fixtures, nao entra no runtime: nenhum modulo em `tucano/` importa nada daqui.
# O Zero Python e sobre o que a biblioteca carrega em producao, nao sobre a
# bancada de medicao.
[feature.comparativo.dependencies]
python = ">=3.11"
polars = "*"
duckdb = "*"
pandas = "*"
pyarrow = "*"

[feature.comparativo.tasks]
referencia = "python tools/bench_referencia.py"
referencia-1t = "python tools/bench_referencia.py --uma-thread"
leitura = "python tools/bench_leitura.py"

[environments]
fixtures = ["fixtures"]
comparativo = ["comparativo"]
